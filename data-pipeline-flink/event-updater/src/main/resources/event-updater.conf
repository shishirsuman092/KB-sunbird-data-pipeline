include "base-config.conf"

kafka {
  input.topic = ${job.env}."dev.telemetry.unique"
  groupId =${job.env}"-telemetry-extractor-group"
}

task {
  deviceprofile {
    parallelism = 1
  }
}

# redis-metadata
redis-meta {
  database {
    devicestore.id = 2
    key.expiry.seconds = 3600
  }
}

postgres {
  database = "test_warehouse"
  table = "user_detail"
}